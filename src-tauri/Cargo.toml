[package]
name = "ohmywu"
version = "0.1.0"
edition = "2024"

[lib]
name = "ohmywu_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ohmywu-domain = { path = "../crates/domain" }
ohmywu-capability-registry = { path = "../crates/capability-registry" }
ohmywu-action-registry = { path = "../crates/action-registry" }
ohmywu-policy-engine = { path = "../crates/policy-engine" }
ohmywu-task-engine = { path = "../crates/task-engine" }
ohmywu-audit = { path = "../crates/audit" }
