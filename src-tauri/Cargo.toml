[package]
name = "ohmywu"
version = "0.2.0"
edition = "2024"

[lib]
name = "ohmywu_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
glob = "0.3"
walkdir = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
ohmywu-domain = { path = "../crates/domain" }
ohmywu-capability-registry = { path = "../crates/capability-registry" }
ohmywu-action-registry = { path = "../crates/action-registry" }
ohmywu-policy-engine = { path = "../crates/policy-engine" }
ohmywu-task-engine = { path = "../crates/task-engine" }
ohmywu-audit = { path = "../crates/audit" }
ohmywu-session = { path = "../crates/session" }
ohmywu-wiki = { path = "../crates/wiki" }
ohmywu-llm-adapter = { path = "../crates/llm-adapter" }
